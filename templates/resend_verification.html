{% extends "base.html" %}
{% block title %}Resend Verification — Aircraft Finder{% endblock %}
{% block content %}
<div class="auth-container"><div class="auth-card card">
    <div class="auth-header"><i class="fa-solid fa-envelope"></i><h1>Resend Verification</h1>
        <p class="subtitle">Enter the email address used for your account.</p></div>
    <form method="POST" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group"><label for="email">Email</label>
            <input type="email" id="email" name="email" required autofocus autocomplete="email"></div>
        <button type="submit" class="btn btn-primary btn-full">Send verification link</button>
    </form>
    <div class="auth-footer"><p><a href="{{ url_for('login_page') }}">Back to sign in</a></p></div>
</div></div>
{% endblock %}
