{% extends "base.html" %}
{% block title %}Aircraft — Aircraft Finder{% endblock %}
{% block nav_aircraft %}active{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Aircraft Directory</h1>
    <p class="subtitle">Search by tail number, model, variant, or name</p>
</div>

<div class="card">
    <div class="search-bar">
        <input type="text" id="aircraft-search" placeholder="e.g. C-130J, 44-27297, Enola Gay, SR-71..." autocomplete="off">
        <button id="aircraft-search-btn" class="btn btn-primary">
            <i class="fa-solid fa-magnifying-glass"></i> Search
        </button>
    </div>

    <div class="filter-chips" id="variant-examples">
        <span class="chip-label">Try:</span>
        <button class="chip" data-q="C-130">C-130</button>
        <button class="chip" data-q="F-16">F-16</button>
        <button class="chip" data-q="B-17">B-17</button>
        <button class="chip" data-q="SR-71">SR-71</button>
        <button class="chip" data-q="P-51">P-51</button>
    </div>
</div>

<div id="aircraft-results" class="results-container"></div>

{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
$(function() {
    var currentPage = 1;
    // Sort state is page-local; doesn't survive a full page reload, but
    // does survive search-text changes and pagination.
    var sortState = {sort_by: '', sort_dir: 'asc'};

    function searchAircraft(page) {
        var q = $('#aircraft-search').val().trim();
        currentPage = page || 1;
        var params = {q: q, page: currentPage};
        if (sortState.sort_by) {
            params.sort_by  = sortState.sort_by;
            params.sort_dir = sortState.sort_dir;
        }
        $.getJSON('/api/aircraft/search', params, function(data) {
            renderAircraftResults(data.results, data.total, '#aircraft-results', data.page, data.pages);
            // attachSortableHeaders runs AFTER renderAircraftResults so the
            // freshly-rendered <th data-sort="..."> elements are present.
            // Clicking a header updates sortState and re-fires the search,
            // resetting to page 1 (sorting + paging are independent UX).
            attachSortableHeaders($('#aircraft-results'), {
                getState: function() { return sortState; },
                setState: function(next) { sortState = next; searchAircraft(1); }
            });
        });
    }

    var initialParams = new URLSearchParams(window.location.search);
    if (initialParams.get('q')) $('#aircraft-search').val(initialParams.get('q'));
    searchAircraft(1);

    $('#aircraft-search-btn').on('click', function() { searchAircraft(1); });
    $('#aircraft-search').on('keypress', function(e) { if (e.which === 13) searchAircraft(1); });

    // Chip filters
    $('.chip').on('click', function() {
        $('#aircraft-search').val($(this).data('q'));
        searchAircraft(1);
    });

    // Pagination
    $(document).on('click', '.page-btn', function() {
        searchAircraft($(this).data('page'));
        window.scrollTo({top: 0, behavior: 'smooth'});
    });

    // A row click goes to the dedicated aircraft page. The designation cell
    // is also a real <a>, so middle-click and "open in new tab" work; this
    // handler just makes the whole row a click target.
    $(document).on('click', '.aircraft-row', function(e) {
        if ($(e.target).closest('a').length) return;   // let the real link win
        window.location.href = '/aircraft/' + $(this).data('id');
    });
});
</script>
{% endblock %}
