{% extends "base.html" %}
{% block title %}Reset Password — Aircraft Finder{% endblock %}
{% block content %}
<div class="auth-container"><div class="auth-card card">
    <div class="auth-header"><i class="fa-solid fa-key"></i><h1>Choose a New Password</h1></div>
    <form method="POST" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="form-group"><label for="password">New password</label>
            <input type="password" id="password" name="password" required autofocus autocomplete="new-password"></div>
        <div class="form-group"><label for="password2">Confirm password</label>
            <input type="password" id="password2" name="password2" required autocomplete="new-password"></div>
        <button type="submit" class="btn btn-primary btn-full">Update password</button>
    </form>
</div></div>
{% endblock %}
