{% extends "mobile/base.html" %}
{% block title %}Reset Password — Aircraft Finder{% endblock %}
{% block content %}
<div class="m-page-header"><h1><i class="fa-solid fa-key"></i> New password</h1></div>
<div class="m-card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="m-field"><label>New password</label><input type="password" name="password" required autofocus autocomplete="new-password"></div>
        <div class="m-field"><label>Confirm password</label><input type="password" name="password2" required autocomplete="new-password"></div>
        <button type="submit" class="m-btn">Update password</button>
    </form>
</div>
{% endblock %}
