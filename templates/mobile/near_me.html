{% extends "mobile/base.html" %}
{% block title %}Museums Near Me — Aircraft Finder{% endblock %}


{% block content %}
<div class="m-page-header">
    <h1><i class="fa-solid fa-location-dot"></i> Museums Near Me</h1>
    <p class="m-subtitle">Find aviation museums close to you, and see what's on display.</p>
</div>

<div class="m-card">
    <button class="m-btn m-btn-primary m-btn-block" id="btn-gps">
        <i class="fa-solid fa-crosshairs"></i> Use my location
    </button>

    <div class="m-or">or</div>

    <div class="m-search-row">
        <input type="text" id="loc-input" aria-label="Zip code or city" inputmode="search"
               placeholder="Zip code or city" autocomplete="postal-code">
        <button class="m-btn m-btn-primary" id="btn-search" aria-label="Search nearby museums">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>

    <div class="m-radius-row">
        <label for="radius">Within</label>
        <select id="radius">
            <option value="">any distance</option>
            <option value="25">25 miles</option>
            <option value="50">50 miles</option>
            <option value="100" selected>100 miles</option>
            <option value="250">250 miles</option>
        </select>
    </div>
</div>

<div id="status" class="m-status"></div>
<div id="results"></div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
(function () {
    var $status = document.getElementById('status');
    var $results = document.getElementById('results');

    function setStatus(msg, kind) {
        $status.className = 'm-status' + (kind ? ' m-status-' + kind : '');
        $status.textContent = msg || '';
    }

    /* Which maps app to hand off to.
       iOS (and iPadOS, which reports as Mac with touch) gets Apple Maps —
       maps.apple.com deep-links into the native app when installed and
       falls back to the web map when not, so we never strand a user.
       Everything else gets Google Maps. Both take a destination string
       rather than coordinates where possible, because a named destination
       survives better in the handoff than a bare lat/lon. */
    function isApplePlatform() {
        var ua = navigator.userAgent || '';
        var iOS = /iPad|iPhone|iPod/.test(ua);
        // iPadOS 13+ masquerades as desktop Safari; touch points give it away.
        var iPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        return iOS || iPadOS;
    }

    function directionsUrl(museum) {
        var hasCoords = museum.latitude != null && museum.longitude != null;
        var coords = hasCoords ? museum.latitude + ',' + museum.longitude : '';
        var addressParts = [museum.name, museum.address, museum.city,
                            museum.state_province, museum.postal_code];
        var label = addressParts.filter(Boolean).join(', ');

        if (isApplePlatform()) {
            // daddr accepts either a coordinate pair or an address string.
            return 'https://maps.apple.com/?daddr=' +
                   encodeURIComponent(hasCoords ? coords : label) +
                   '&q=' + encodeURIComponent(museum.name);
        }
        return 'https://www.google.com/maps/dir/?api=1&destination=' +
               encodeURIComponent(hasCoords ? coords : label);
    }

    function mapsLabel() { return isApplePlatform() ? 'Apple Maps' : 'Google Maps'; }

    function render(data) {
        if (!data.results.length) {
            $results.innerHTML = '<p class="m-empty">No museums found' +
                (data.radius_miles ? ' within ' + data.radius_miles + ' miles' : '') +
                '. Try a wider radius.</p>';
            return;
        }
        var html = '';
        data.results.forEach(function (r) {
            var m = r.museum;
            var place = [m.city, m.state_province].filter(Boolean).join(', ');
            html +=
              '<div class="m-museum" data-museum-id="' + m.id + '">' +
                '<div class="m-museum-head" role="button" tabindex="0" aria-expanded="false">' +
                  '<div class="m-museum-title">' +
                    '<strong>' + escHtml(m.name) + '</strong>' +
                    '<span class="m-museum-place">' + escHtml(place) + '</span>' +
                  '</div>' +
                  '<div class="m-museum-meta">' +
                    '<span class="m-dist">' + r.distance_miles + ' mi</span>' +
                    '<span class="m-count">' + r.aircraft_count + ' aircraft</span>' +
                    '<i class="fa-solid fa-chevron-down m-chev"></i>' +
                  '</div>' +
                '</div>' +
                '<div class="m-museum-body" hidden>' +
                  '<div class="m-actions">' +
                    '<a class="m-btn m-btn-secondary" href="/museums/' + m.id + '">View museum</a>' +
                    '<a class="m-btn m-btn-secondary" target="_blank" rel="noopener" ' +
                       'href="' + directionsUrl(m) + '">' +
                      '<i class="fa-solid fa-diamond-turn-right"></i> ' + mapsLabel() +
                    '</a>' +
                    (m.website
                      ? '<a class="m-btn m-btn-secondary" target="_blank" rel="noopener" href="' +
                        escHtml(m.website) + '"><i class="fa-solid fa-globe"></i> Website</a>'
                      : '') +
                  '</div>' +
                  '<div class="m-aircraft-list"><p class="m-loading">Loading aircraft…</p></div>' +
                '</div>' +
              '</div>';
        });
        $results.innerHTML = html;
    }

    /* Aircraft are fetched only when a card is opened — 40 museums would
       otherwise mean 40 requests on a phone connection. visible_only=true
       so we never promise an aircraft that's in storage. */
    function toggle(card) {
        var body = card.querySelector('.m-museum-body');
        var open = !body.hidden;
        body.hidden = open;
        card.classList.toggle('is-open', !open);
        card.querySelector('.m-museum-head').setAttribute('aria-expanded', String(!open));
        if (open) return;

        var id = card.getAttribute('data-museum-id');
        if (card.dataset.collectionState) return;
        card.dataset.collectionState = 'loading';
        var target = card.querySelector('.m-aircraft-list');
        fetch('/api/v1/museums/' + id + '?visible_only=true')
            .then(function (r) { if (!r.ok) throw new Error('Collection request failed'); return r.json(); })
            .then(function (d) {
                card.dataset.collectionState = 'loaded';
                var list = d.aircraft || [];
                if (!list.length) {
                    target.innerHTML = '<p class="m-empty">No aircraft on display here yet.</p>';
                    return;
                }
                list.sort(function (a, b) {
                    return (a.full_designation || '').localeCompare(b.full_designation || '');
                });
                target.innerHTML = '<ul class="m-aircraft">' + list.map(function (a) {
                    var name = escHtml([a.manufacturer, a.full_designation || a.model].filter(Boolean).join(' '));
                    if (a.model_name) name += ' <span class="m-ac-name">' + escHtml(a.model_name) + '</span>';
                    var tail = a.tail_number ? '<span class="m-tail">' + escHtml(a.tail_number) + '</span>' : '';
                    return '<li><a href="/aircraft/' + a.id + '">' + name + tail + '</a></li>';
                }).join('') + '</ul>';
            })
            .catch(function () {
                delete card.dataset.collectionState;
                target.innerHTML = '<p class="m-empty">Could not load aircraft. Close and reopen this museum to retry.</p>';
            });
    }

    $results.addEventListener('click', function (e) {
        var head = e.target.closest('.m-museum-head');
        if (head) toggle(head.parentElement);
    });
    $results.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        var head = e.target.closest('.m-museum-head');
        if (head) { e.preventDefault(); toggle(head.parentElement); }
    });

    function search(params) {
        var radius = document.getElementById('radius').value;
        if (radius) params.radius = radius;
        params.limit = 50;
        var qs = Object.keys(params).map(function (k) {
            return k + '=' + encodeURIComponent(params[k]);
        }).join('&');
        setStatus('Searching…');
        $results.innerHTML = '';
        fetch('/api/v1/museums/nearest?' + qs)
            .then(function (r) { return r.json().then(function (d) { return {ok: r.ok, d: d}; }); })
            .then(function (res) {
                if (!res.ok) { setStatus(res.d.error || 'Search failed.', 'error'); return; }
                var origin = res.d.origin.location || 'your location';
                setStatus('Showing ' + res.d.count + ' of ' + res.d.total_in_range +
                          ' museums near ' + origin + '.');
                render(res.d);
            })
            .catch(function () { setStatus('Network error — please try again.', 'error'); });
    }

    document.getElementById('btn-gps').addEventListener('click', function () {
        if (!navigator.geolocation) {
            setStatus('This browser does not support location. Enter a zip code instead.', 'error');
            return;
        }
        setStatus('Getting your location…');
        navigator.geolocation.getCurrentPosition(
            function (pos) {
                search({lat: pos.coords.latitude.toFixed(5),
                        lon: pos.coords.longitude.toFixed(5)});
            },
            function (err) {
                // Denied is the common case and deserves a plain explanation
                // rather than a raw error code.
                setStatus(err.code === err.PERMISSION_DENIED
                    ? 'Location permission denied. Enter a zip code or city instead.'
                    : 'Could not get your location. Enter a zip code or city instead.', 'error');
            },
            {enableHighAccuracy: false, timeout: 10000, maximumAge: 300000}
        );
    });

    function doTextSearch() {
        var v = document.getElementById('loc-input').value.trim();
        if (!v) { setStatus('Enter a zip code or city name.', 'error'); return; }
        search({location: v});
    }
    document.getElementById('btn-search').addEventListener('click', doTextSearch);
    document.getElementById('loc-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') doTextSearch();
    });
})();
</script>
{% endblock %}
